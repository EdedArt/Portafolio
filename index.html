    <script>
      // Aplica tema e idioma antes del primer render para evitar parpadeo.
      // Por defecto: tema claro y español, sin importar la configuración del sistema.
      ;(function () {
        try {
          var theme = localStorage.getItem('theme')
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0c0809')
          }
          var lang = localStorage.getItem('lang')
          if (lang === 'en' || lang === 'es') document.documentElement.lang = lang
        } catch (e) {}
      })()
    </script>
