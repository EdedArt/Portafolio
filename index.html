<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edgar Arteaga · Portafolio</title>
    <meta name="theme-color" content="#fbf8f7" />
    <script>
      // Aplica tema e idioma antes del primer render para evitar parpadeo.
      ;(function () {
        try {
          var theme = localStorage.getItem('theme')
          if (theme === 'dark') document.documentElement.classList.add('dark')
          var lang = localStorage.getItem('lang')
          if (lang === 'en' || lang === 'es') document.documentElement.lang = lang
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
